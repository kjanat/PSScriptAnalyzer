name: Release dprint PowerShell formatter

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'kjanat/PSScriptAnalyzer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mise and install tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
      - name: Verify release version
        run: |
          version=$(mise exec -- dotnet msbuild Formatter.Dprint/Formatter.Dprint.csproj \
            -nologo \
            -getProperty:Version)
          if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match dprint plugin version $version." >&2
            exit 1
          fi
      - name: Install .NET WASI workload
        run: >-
          mise exec -- dotnet workload install wasi-experimental
          --skip-manifest-update
          --source https://api.nuget.org/v3/index.json
      - name: Build and validate plugin
        run: Formatter.Dprint/scripts/e2e.sh
      - name: Assemble release assets
        run: |
          release_dir="$RUNNER_TEMP/dprint-release"
          mkdir -p "$release_dir"
          cp Formatter.Dprint/bin/Release/net8.0/wasi-wasm/AppBundle/plugin.wasm "$release_dir/plugin.wasm"
          cp Formatter.Dprint/schema.json "$release_dir/schema.json"
          cd "$release_dir"
          sha256sum plugin.wasm schema.json > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(< Formatter.Dprint/release-notes.md)
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/dprint-release/plugin.wasm" \
            "$RUNNER_TEMP/dprint-release/schema.json" \
            "$RUNNER_TEMP/dprint-release/checksums.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "dprint PowerShell formatter $GITHUB_REF_NAME" \
            --notes "$notes" \
            --generate-notes
