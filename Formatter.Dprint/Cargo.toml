[package]
name = "dprint-plugin-powershell"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "dprint Wasm plugin for PowerShell formatting"
readme = "README.md"
repository = "https://github.com/kjanat/PSScriptAnalyzer"
license = "MIT"
keywords = ["dprint", "formatter", "powershell", "wasm"]
categories = ["development-tools", "text-editors"]
publish = false
autobins = false

[lib]
crate-type = ["cdylib", "lib"]
name = "dprint_plugin_powershell"
path = "src/lib.rs"

[[bin]]
name = "generate-schema"
path = "src/bin/generate-schema.rs"
required-features = ["schema"]

[dependencies]
anyhow = "1"
dprint-core = { version = "0.67", features = ["wasm"] }
json-schema-sort = {
  version = "0.1",
  default-features = false,
  optional = true
}
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tree-sitter = "0.26"
tree-sitter-pwsh = "0.38"

[features]
default = []
schema = ["dep:json-schema-sort", "dep:schemars"]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
